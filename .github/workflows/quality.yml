name: Bossie production quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bossie-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (required)
        run: npm audit --audit-level=moderate

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Cloudflare Worker adapter build
        run: npm run cf:build

  browser-quality:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install application dependencies
        run: npm ci --no-fund
      - name: Install pinned browser runner without altering the lockfile
        run: npm install --no-save --package-lock=false --ignore-scripts --no-fund @playwright/test@1.65.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify public pages, menu, search and request flow on real viewports
        run: npx playwright test
      - name: Preserve screenshots, browser video and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bossie-browser-screenshots
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

  deploy-cloudflare:
    if: github.event_name == 'push'
    needs: [validate, browser-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verify dedicated Bossie Cloudflare credentials
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Deployment unavailable: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub Actions repository secrets for the Bossie Cloudflare account."
            exit 1
          fi
          if [ "${CLOUDFLARE_ACCOUNT_ID}" != "4f59aa5b14f5882688437af50ee8c2ac" ]; then
            echo "::error::Cloudflare account ID does not match the documented Bossie-only deployment account. Refusing cross-project deployment."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Publish Bossie Worker only
        run: npm run cf:deploy

  live-health:
    if: github.event_name == 'push'
    needs: deploy-cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify newly deployed studio homepage and production routes
        run: |
          set -euo pipefail
          routes=("/" "/music" "/worlds" "/cinema" "/about" "/industry" "/request" "/epk" "/links")
          for attempt in $(seq 1 36); do
            all_ok=1
            for route in "${routes[@]}"; do
              code=$(curl -L -sS -o /tmp/bossie.html -w '%{http_code}' --max-time 20 "https://bossieonthatbeat.com${route}" || true)
              echo "Attempt ${attempt}/36 ${route}: HTTP ${code}"
              if [ "$code" != "200" ]; then
                all_ok=0
              fi
            done

            music_html=$(curl -L -sS --max-time 20 "https://bossieonthatbeat.com/music" || true)
            if ! printf '%s' "$music_html" | grep -q "Find your next favourite."; then
              echo "Attempt ${attempt}/36: /music is still serving an older deployment."
              all_ok=0
            fi

            home_html=$(curl -L -sS --max-time 20 "https://bossieonthatbeat.com/" || true)
            # Compare actual homepage copy against the newly deployed studio design.
            if [[ "$home_html" != *"Not just a beat."* ]] || [[ "$home_html" != *"The listening room"* ]] || [[ "$home_html" != *"Your story."* ]]; then
              echo "Attempt ${attempt}/36: new music studio homepage content not deployed yet."
              all_ok=0
            fi

            industry_html=$(curl -L -sS --max-time 20 "https://bossieonthatbeat.com/industry" || true)
            if [[ "$industry_html" != *"Music that moves the story forward."* ]]; then
              echo "Attempt ${attempt}/36: new services and licensing page not deployed yet."
              all_ok=0
            fi

            request_html=$(curl -L -sS --max-time 20 "https://bossieonthatbeat.com/request" || true)
            if [[ "$request_html" != *"Start your request."* ]]; then
              echo "Attempt ${attempt}/36: redesigned request form has not been deployed."
              all_ok=0
            fi

            # Validate the newly published *content*, not only 200 status.
            # Older edge responses or a stale Worker must not pass a release.
            links_html=$(curl -L -sS --max-time 20 -H 'Cache-Control: no-cache' "https://bossieonthatbeat.com/links" || true)
            if [[ "$links_html" != *"Listen. Follow."* ]] || [[ "$links_html" != *"Stay connected."* ]]; then
              echo "Attempt ${attempt}/36: official Links page is still serving older content."
              all_ok=0
            fi

            epk_html=$(curl -L -sS --max-time 20 -H 'Cache-Control: no-cache' "https://bossieonthatbeat.com/epk" || true)
            if [[ "$epk_html" != *"An independent voice across genres."* ]] || [[ "$epk_html" != *"Music from different worlds."* ]]; then
              echo "Attempt ${attempt}/36: press kit has not received the curated release update."
              all_ok=0
            fi

            # Cinema is backed by Cloudflare D1, while the local test seed
            # is intentionally empty. Assert the actual deployed catalogue
            # and one real detail page rather than treating an empty stub as QA.
            cinema_html=$(curl -L -sS --max-time 20 -H 'Cache-Control: no-cache' "https://bossieonthatbeat.com/cinema" || true)
            if [[ "$cinema_html" != *"cinema-featured-heading"* ]] || [[ "$cinema_html" != *"BOSSIE CINEMA COLLECTION"* ]]; then
              echo "Attempt ${attempt}/36: new Cinema category layout is not live."
              all_ok=0
            fi

            cinema_detail_path=$(printf '%s' "$cinema_html" | grep -oE 'href="/cinema/[a-zA-Z0-9_-]+"' | head -n 1 | cut -d '"' -f2 || true)
            if [ -z "$cinema_detail_path" ]; then
              echo "Attempt ${attempt}/36: no public Cinema detail link found in live catalogue."
              all_ok=0
            else
              cinema_detail_html=$(curl -L -sS --max-time 20 -H 'Cache-Control: no-cache' "https://bossieonthatbeat.com${cinema_detail_path}" || true)
              if [[ "$cinema_detail_html" != *'aria-label="Breadcrumb"'* ]] || [[ "$cinema_detail_html" != *"Back to Cinema"* ]] || [[ "$cinema_detail_html" != *"Keep exploring"* ]]; then
                echo "Attempt ${attempt}/36: Cinema detail is missing breadcrumb, related work or return navigation."
                all_ok=0
              fi
            fi

            if [ "$all_ok" = "1" ]; then
              echo "BOSSIE_PRODUCTION_HEALTH=PASS"
              exit 0
            fi
            sleep 10
          done
          echo "BOSSIE_PRODUCTION_HEALTH=FAIL"
          exit 1
