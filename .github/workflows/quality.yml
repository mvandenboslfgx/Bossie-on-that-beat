name: Bossie production quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bossie-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

  live-health:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for Cloudflare Git deployment and verify production content
        run: |
          set -euo pipefail
          routes=("/" "/music" "/worlds" "/cinema" "/about")
          for attempt in $(seq 1 36); do
            all_ok=1
            for route in "${routes[@]}"; do
              code=$(curl -L -sS -o /tmp/bossie.html -w '%{http_code}' --max-time 20 "https://bossieonthatbeat.com${route}" || true)
              echo "Attempt ${attempt}/36 ${route}: HTTP ${code}"
              if [ "$code" != "200" ]; then
                all_ok=0
              fi
            done

            music_html=$(curl -L -sS --max-time 20 "https://bossieonthatbeat.com/music" || true)
            if ! printf '%s' "$music_html" | grep -q "Listen everywhere"; then
              echo "Attempt ${attempt}/36: /music is still serving an older deployment."
              all_ok=0
            fi

            home_html=$(curl -L -sS --max-time 20 "https://bossieonthatbeat.com/" || true)
            if ! printf '%s' "$home_html" | grep -q "Global distribution"; then
              echo "Attempt ${attempt}/36: home is still serving an older deployment."
              all_ok=0
            fi

            if [ "$all_ok" = "1" ]; then
              echo "BOSSIE_PRODUCTION_HEALTH=PASS"
              exit 0
            fi
            sleep 10
          done
          echo "BOSSIE_PRODUCTION_HEALTH=FAIL"
          exit 1
