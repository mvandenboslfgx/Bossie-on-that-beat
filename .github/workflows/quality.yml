name: Bossie production quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bossie-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

  live-audit:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for healthy Cloudflare production
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            code=$(curl -L -sS -o /tmp/bossie-home.html -w '%{http_code}' --max-time 20 https://bossieonthatbeat.com/ || true)
            echo "Production readiness attempt ${attempt}/36: HTTP ${code}"
            if [ "$code" = "200" ] && grep -qi "Bossie on that beat" /tmp/bossie-home.html; then
              echo "Production is healthy and serving Bossie."
              exit 0
            fi
            sleep 10
          done
          echo "Production never reached a healthy HTTP 200 state."
          exit 1

      - name: Lighthouse mobile
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npx --yes lighthouse@13.5.0 https://bossieonthatbeat.com/ \
              --quiet \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --max-wait-for-load=60000 \
              --output=json \
              --output-path=./lighthouse-mobile.json; then
              exit 0
            fi
            echo "Mobile Lighthouse attempt ${attempt}/3 failed; retrying..."
            sleep 20
          done
          exit 1

      - name: Lighthouse desktop
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npx --yes lighthouse@13.5.0 https://bossieonthatbeat.com/ \
              --quiet \
              --preset=desktop \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --max-wait-for-load=60000 \
              --output=json \
              --output-path=./lighthouse-desktop.json; then
              exit 0
            fi
            echo "Desktop Lighthouse attempt ${attempt}/3 failed; retrying..."
            sleep 20
          done
          exit 1

      - name: Print Bossie quality scores
        run: |
          node <<'NODE'
          const fs = require('fs');
          for (const [label, file] of [['MOBILE', 'lighthouse-mobile.json'], ['DESKTOP', 'lighthouse-desktop.json']]) {
            const lhr = JSON.parse(fs.readFileSync(file, 'utf8'));
            const score = (id) => Math.round((lhr.categories[id]?.score ?? 0) * 100);
            const agent = lhr.categories['agentic-browsing'];
            const refs = (agent?.auditRefs ?? []).filter((ref) => {
              const audit = lhr.audits[ref.id];
              return audit && !['notApplicable', 'informative', 'manual'].includes(audit.scoreDisplayMode);
            });
            const passed = refs.filter((ref) => lhr.audits[ref.id]?.score === 1).length;
            const metric = (id) => lhr.audits[id]?.displayValue ?? 'n/a';
            console.log(`${label}: Performance ${score('performance')} / Accessibility ${score('accessibility')} / Best Practices ${score('best-practices')} / SEO ${score('seo')} / Agentic ${passed}/${refs.length}`);
            console.log(`${label}: FCP ${metric('first-contentful-paint')} | LCP ${metric('largest-contentful-paint')} | TBT ${metric('total-blocking-time')} | CLS ${metric('cumulative-layout-shift')} | SI ${metric('speed-index')}`);
            const failing = refs.filter((ref) => lhr.audits[ref.id]?.score !== 1).map((ref) => ref.id);
            if (failing.length) console.log(`${label}: Agentic failing audits: ${failing.join(', ')}`);
          }
          NODE

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bossie-lighthouse-${{ github.sha }}
          path: |
            lighthouse-mobile.json
            lighthouse-desktop.json
          if-no-files-found: ignore
          retention-days: 14
