name: Bossie production quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bossie-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

  deploy:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 4f59aa5b14f5882688437af50ee8c2ac
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare deployment credentials
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN is missing from GitHub Actions secrets."
            exit 1
          fi

      - name: Deploy Bossie production Worker
        run: npm run cf:deploy

  live-health:
    if: github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify public production routes
        run: |
          set -euo pipefail
          routes=("/" "/music" "/worlds" "/cinema" "/about")
          for attempt in $(seq 1 24); do
            all_ok=1
            for route in "${routes[@]}"; do
              code=$(curl -L -sS -o /tmp/bossie.html -w '%{http_code}' --max-time 20 "https://bossieonthatbeat.com${route}" || true)
              echo "Attempt ${attempt}/24 ${route}: HTTP ${code}"
              if [ "$code" != "200" ]; then
                all_ok=0
              fi
            done
            if [ "$all_ok" = "1" ]; then
              echo "BOSSIE_PRODUCTION_HEALTH=PASS"
              exit 0
            fi
            sleep 10
          done
          echo "BOSSIE_PRODUCTION_HEALTH=FAIL"
          exit 1
