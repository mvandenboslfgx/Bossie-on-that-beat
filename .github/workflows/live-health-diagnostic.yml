name: Bossie live health diagnostic

on:
  push:
    branches: [diagnostic-live-health]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Probe production endpoints
        run: |
          set +e
          probe() {
            label="$1"
            url="$2"
            echo "===== ${label} :: ${url} ====="
            curl -L -sS -D /tmp/headers.txt -o /tmp/body.txt \
              --connect-timeout 10 --max-time 30 \
              -A 'Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 Chrome/141.0.0.0 Mobile Safari/537.36' \
              -w '\nHTTP=%{http_code} TOTAL=%{time_total}s TTFB=%{time_starttransfer}s SIZE=%{size_download}\n' \
              "$url"
            echo '--- headers ---'
            sed -n '1,80p' /tmp/headers.txt
            echo '--- body first 1200 bytes ---'
            head -c 1200 /tmp/body.txt
            echo
          }
          probe apex https://bossieonthatbeat.com/
          probe robots https://bossieonthatbeat.com/robots.txt
          probe llms https://bossieonthatbeat.com/llms.txt
          probe music https://bossieonthatbeat.com/music
          probe www https://www.bossieonthatbeat.com/

      - name: Probe Googlebot response
        run: |
          curl -L -sS -D - -o /tmp/googlebot-body.txt \
            --connect-timeout 10 --max-time 30 \
            -A 'Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)' \
            -w '\nHTTP=%{http_code} TOTAL=%{time_total}s TTFB=%{time_starttransfer}s SIZE=%{size_download}\n' \
            https://bossieonthatbeat.com/ || true
          echo '--- Googlebot body first 1200 bytes ---'
          head -c 1200 /tmp/googlebot-body.txt || true

      - name: Report Cloudflare credential availability
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then echo 'CLOUDFLARE_API_TOKEN configured: true'; else echo 'CLOUDFLARE_API_TOKEN configured: false'; fi
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then echo 'CLOUDFLARE_ACCOUNT_ID configured: true'; else echo 'CLOUDFLARE_ACCOUNT_ID configured: false'; fi

      - name: Capture Worker exception when credentials exist
        run: |
          set +e
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo 'No Cloudflare API token in GitHub Actions; skipping wrangler tail.'
            exit 0
          fi
          timeout 35s npx --yes wrangler@4.141.0 tail bossie-on-that-beat --format=json > /tmp/wrangler-tail.log 2>&1 &
          tail_pid=$!
          sleep 10
          curl -L -sS -o /dev/null --max-time 15 https://bossieonthatbeat.com/ || true
          sleep 10
          kill "$tail_pid" 2>/dev/null || true
          wait "$tail_pid" 2>/dev/null || true
          echo '===== WRANGLER TAIL ====='
          cat /tmp/wrangler-tail.log || true
