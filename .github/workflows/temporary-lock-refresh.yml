name: Temporary dependency lock refresh

on:
  push:
    branches:
      - security/bossie-dependency-repair-20261109

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout security branch only
        uses: actions/checkout@v4
        with:
          ref: security/bossie-dependency-repair-20261109
          persist-credentials: true
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve compatible lockfile without lifecycle scripts
        run: |
          npm install --package-lock-only --ignore-scripts --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
      - name: Verify deterministic install
        run: npm ci --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Report remaining advisories
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Commit lockfile back to security branch only
        run: |
          git config user.name "Bossie dependency maintenance"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security: refresh locked dependency graph with patched packages"
            git push origin HEAD:security/bossie-dependency-repair-20261109
          else
            echo "Lockfile already up to date."
          fi
