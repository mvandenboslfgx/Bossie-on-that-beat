name: Bossie Browser QA

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci --no-fund

      - name: Install pinned browser test runner
        run: npm install --no-save --package-lock=false --ignore-scripts --no-fund @playwright/test@1.65.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test desktop, tablet and mobile
        run: npx playwright test

      - name: Preserve screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bossie-browser-screenshots
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
