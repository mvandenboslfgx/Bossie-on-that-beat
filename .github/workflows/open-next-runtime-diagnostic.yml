name: Bossie OpenNext runtime diagnostic

on:
  push:
    branches: [runtime-next-16-3-test]

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Print runtime versions
        run: npm list next @opennextjs/cloudflare wrangler --depth=0

      - name: Build OpenNext Worker
        run: npm run cf:build

      - name: Start local Worker and probe routes
        run: |
          set +e
          npx wrangler dev --local --port 8787 > /tmp/wrangler-local.log 2>&1 &
          pid=$!
          root_code=000
          for attempt in $(seq 1 30); do
            root_code=$(curl -sS -o /tmp/local-body.html -w '%{http_code}' --max-time 5 http://127.0.0.1:8787/ || true)
            echo "local attempt ${attempt}: HTTP ${root_code}"
            if [ "$root_code" != "000" ]; then break; fi
            sleep 2
          done
          echo '===== LOCAL ROOT RESPONSE ====='
          if [ -f /tmp/local-body.html ]; then head -c 2000 /tmp/local-body.html; echo; fi
          for path in robots.txt llms.txt music; do
            echo "===== /${path} ====="
            curl -sS -D - -o /tmp/route-body.txt --max-time 10 "http://127.0.0.1:8787/${path}" -w '\nHTTP=%{http_code} TOTAL=%{time_total}s TTFB=%{time_starttransfer}s\n' || true
            head -c 1000 /tmp/route-body.txt 2>/dev/null || true
            echo
          done
          echo '===== WRANGLER LOCAL LOG ====='
          cat /tmp/wrangler-local.log || true
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          if [ "$root_code" != "200" ]; then exit 1; fi
